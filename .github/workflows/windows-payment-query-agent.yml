name: Windows payment query agent

on:
  pull_request:
    branches: [main]
    paths:
      - 'windows/payment_query_*'
      - 'windows/README_PAYMENT_QUERY_TEST.txt'
      - '.github/workflows/windows-payment-query-agent.yml'
  push:
    branches: [main]
    paths:
      - 'windows/payment_query_*'
      - 'windows/README_PAYMENT_QUERY_TEST.txt'
      - '.github/workflows/windows-payment-query-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 pyinstaller==6.16.0
      - name: Compile source
        run: python -m py_compile windows/payment_query_agent.py
      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm --onefile --name ChenPaymentQueryAgent windows/payment_query_agent.py
      - name: Assemble test package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\ChenPaymentQueryAgent.exe package\
          Copy-Item windows\payment_query_diagnostic.cmd package\
          Copy-Item windows\payment_query_agent_start.cmd package\
          Copy-Item windows\README_PAYMENT_QUERY_TEST.txt package\
          Compress-Archive -Path package\* -DestinationPath ChenPaymentQueryAgent-test.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ChenPaymentQueryAgent-test
          path: ChenPaymentQueryAgent-test.zip
          if-no-files-found: error
          retention-days: 14
