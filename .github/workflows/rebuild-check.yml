name: v1.2 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          find app/static -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' asset; do
            node --check "$asset"
          done

      - name: Compile Python
        run: python -m compileall -q app storage_node tests

      - name: Existing feature compatibility audit policy
        run: |
          python tests/compatibility_audit_contract.py
          python tests/v143_extended_contract.py
          python tests/v144_full_audit_contract.py

      - name: v1.2 architecture and recipe tools contracts
        run: |
          python tests/stability_contract.py
          python tests/v12_contract.py
          python tests/v125_contract.py

      - name: Legacy work-system compatibility contracts
        run: |
          python tests/v03_contract.py
          python tests/v03_runtime_fix_contract.py
          python tests/v03_customer_scope_contract.py
          python tests/v03_safety_foxmail_contract.py
          python tests/v03_payment_template_contract.py
          python tests/v031_payment_workflow_contract.py
          python tests/v031_windows_bootstrap_contract.py
          python tests/v032_customer_import_contract.py
          python tests/v032_customer_exchange_contract.py

      - name: Production regressions
        run: |
          python tests/production_experience_regression.py
          python tests/promotion_render_regression.py
          python tests/promotion_rename_route_regression.py

      - name: v1.2 recipe tools browser acceptance
        run: python tests/v12_recipe_tools_acceptance.py

      - name: v1.2 workspace isolation acceptance
        run: python tests/v10_workspace_isolation_acceptance.py

      - name: v1.2.8 table finder / exact-number landing acceptance
        run: python tests/v124_payment_search_acceptance.py

      - name: v1.2.6 workflow rollback acceptance
        run: python tests/v126_payment_workflow_rollback_acceptance.py

      - name: v1.2.7 stale-UI server-first rollback acceptance
        run: python tests/v127_server_first_rollback_acceptance.py

      - name: v1.3 remote customer documents acceptance
        run: python tests/v13_customer_documents_acceptance.py

      - name: v1.4.2 navigation and row-review acceptance
        run: python tests/v141_navigation_review_acceptance.py

      - name: v1.4.3 centered navigation and customer status acceptance
        run: python tests/v143_customer_status_acceptance.py

      - name: v1.4.3 payment controls acceptance
        run: python tests/v143_payment_controls_acceptance.py

      - name: Legacy customer import browser acceptance
        run: python tests/v032_customer_import_acceptance.py

      - name: Legacy payment workflow browser acceptance
        run: python tests/v031_payment_workflow_acceptance.py

      - name: Legacy customer browser acceptance
        run: python tests/v031_legacy_customer_acceptance.py

      - name: Legacy runtime-fix browser acceptance
        run: python tests/v03_runtime_fix_acceptance.py

      - name: Legacy insert-order browser acceptance
        run: python tests/v03_insert_order_acceptance.py

      - name: Legacy review-reset browser acceptance
        run: python tests/v03_review_reset_acceptance.py
