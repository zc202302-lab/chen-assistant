name: v1.2 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change scope
        id: scope
        shell: bash
        run: |
          mode=full
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mode=fast
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/chen-changed-files.txt
            echo "Changed files:"
            cat /tmp/chen-changed-files.txt
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                docs/*|app/templates/home_v10.html|app/static/home-*.css|tests/v10_workspace_isolation_acceptance.py|tests/v153_home_navigation_contract.py)
                  ;;
                *)
                  mode=full
                  break
                  ;;
              esac
            done < /tmp/chen-changed-files.txt
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Validation mode: $mode"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode == 'full'
        with:
          node-version: '22'

      - name: Install fast validation dependencies
        if: steps.scope.outputs.mode == 'fast'
        run: pip install -r requirements.txt playwright

      - name: Install full validation dependencies
        if: steps.scope.outputs.mode == 'full'
        run: pip install -r requirements.txt playwright pip-audit bandit

      - name: Install Chromium
        run: |
          # Self-hosted runners are dynamic infrastructure. Some runners do not
          # grant passwordless sudo, so Playwright cannot install OS packages
          # globally. Preserve the full browser test suite by staging the exact
          # Chromium runtime packages reported by Playwright into RUNNER_TEMP.
          if [ "$(id -u)" -eq 0 ] || (command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null); then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
            deps_root="${RUNNER_TEMP}/playwright-linux-deps"
            rm -rf "${deps_root}"
            mkdir -p "${deps_root}/debs" "${deps_root}/root"
            set +e
            dry_run="$(python -m playwright install-deps --dry-run chromium 2>&1)"
            dry_status=$?
            set -e
            echo "Playwright install-deps dry-run exit status: ${dry_status}"
            package_line="$(printf '%s\n' "${dry_run}" | sed -n 's/.*apt-get install -y --no-install-recommends //p' | head -n1)"
            package_line="${package_line%\"}"
            packages=()
            if [ -n "${package_line}" ]; then
              read -r -a packages <<< "${package_line}"
            else
              # Playwright 1.63 on Ubuntu 24.04 may return status 1 and print
              # "Missing system dependencies (N):" followed by an indented
              # package list instead of an apt-get command.
              mapfile -t packages < <(
                printf '%s\n' "${dry_run}" |
                  awk '
                    /^Missing system dependencies \([0-9]+\):$/ { capture=1; next }
                    capture && /^  [[:alnum:]][[:alnum:].+:-]*$/ { sub(/^  /, ""); print; next }
                    capture { exit }
                  '
              )
            fi
            if [ "${#packages[@]}" -eq 0 ]; then
              echo "Unable to derive Playwright Chromium dependency package list" >&2
              printf '%s\n' "${dry_run}" >&2
              exit 1
            fi
            printf 'Staging %d Playwright Linux dependency packages\n' "${#packages[@]}"
            (
              cd "${deps_root}/debs"
              apt-get download "${packages[@]}"
              for package in ./*.deb; do
                dpkg-deb --extract "${package}" "${deps_root}/root"
              done
            )
            portable_libs="${deps_root}/root/usr/lib/x86_64-linux-gnu:${deps_root}/root/lib/x86_64-linux-gnu"
            echo "LD_LIBRARY_PATH=${portable_libs}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          fi

      - name: Fast UI contracts
        if: steps.scope.outputs.mode == 'fast'
        run: |
          python -m compileall -q app tests/v10_workspace_isolation_acceptance.py tests/v153_home_navigation_contract.py
          python tests/stability_contract.py
          python tests/v153_home_navigation_contract.py
          python tests/v10_workspace_isolation_acceptance.py
          python tests/architecture_governance_contract.py

      - name: Check JavaScript syntax
        if: steps.scope.outputs.mode == 'full'
        run: |
          find app/static -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' asset; do
            node --check "$asset"
          done

      - name: Compile Python
        if: steps.scope.outputs.mode == 'full'
        run: python -m compileall -q app storage_node tests

      - name: Legacy payment workflow browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v031_payment_workflow_acceptance.py

      - name: v1.4.3 payment controls acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v143_payment_controls_acceptance.py

      - name: Work lists contract and browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/work_lists_contract.py
          python tests/payment_next_date_contract.py
          python tests/payment_next_date_acceptance.py
          python tests/work_sheet_contract.py
          python tests/work_sheet_acceptance.py
          python tests/work_lists_acceptance.py
          python tests/work_list_import_contract.py
          python tests/work_list_import_acceptance.py

      - name: Upload list layout previews
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: list-compact-preview
          path: artifacts/list-compact
          if-no-files-found: ignore

      - name: Number inbox batch contract and browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/number_inbox_archive_contract.py
          python tests/work_entry_layout_contract.py
          python tests/work_entry_layout_acceptance.py
          python -m unittest discover -s tests -p test_home_shortcuts_contract.py -v
          python tests/home_module_style_acceptance.py
          python tests/number_inbox_batch_contract.py
          python tests/number_inbox_batch_acceptance.py
          python tests/promotion_slots_acceptance.py
          python tests/promotion_overview_acceptance.py

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.mode == 'full'
        with:
          name: number-inbox-batch-ui-preview
          retention-days: 1
          path: artifacts/number-inbox-batch
          if-no-files-found: error

      - name: Security audit
        if: steps.scope.outputs.mode == 'full'
        run: |
          pip-audit -r requirements.txt
          bandit -q -r app storage_node -lll

      - name: v1.5.1 live quick-search acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v151_quick_search_live_acceptance.py

      - name: Web Push and reminder contracts
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/reminders_push_contract.py
          node tests/reminders_service_worker_contract.cjs
          python tests/pwa_experience_acceptance.py

      - name: Input selection browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/input_selection_acceptance.py

      - name: Code governance inventory
        if: steps.scope.outputs.mode == 'full'
        run: python tests/code_governance_inventory.py

      - name: Dead route source inventory
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/dead_route_source_inventory.py
          python tests/routing_registry_contract.py
          python tests/customer_export_text_contract.py
          python tests/architecture_governance_contract.py

      - name: Detached module reference inventory
        if: steps.scope.outputs.mode == 'full'
        run: python tests/dead_module_reference_inventory.py

      - name: Template reference inventory
        if: steps.scope.outputs.mode == 'full'
        run: python tests/template_reference_inventory.py

      - name: Existing feature compatibility audit policy
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/compatibility_audit_contract.py
          python tests/v143_extended_contract.py
          python tests/v144_full_audit_contract.py
          python tests/v144_audit_acceptance.py
          python tests/v145_foxmail_launch_contract.py
          python tests/v145_bootstrap_iex_contract.py
          python tests/v151_quick_search_contract.py
          python tests/v152_high_frequency_flow_contract.py
          python tests/v159_payment_initiate_safety_contract.py
          python tests/v1510_payment_enter_navigation_contract.py
          python tests/v1511_payment_dashboard_contract.py
          python tests/v160_information_center_contract.py
          python tests/v161_responsive_polish_contract.py
          python tests/v162_number_inbox_contract.py
          python tests/v164_task_review_contract.py
          python tests/production_auto_deploy_contract.py
          python tests/v153_home_navigation_contract.py

      - name: v1.2 architecture and recipe tools contracts
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/stability_contract.py
          python tests/v12_contract.py
          python tests/v125_contract.py

      - name: Legacy work-system compatibility contracts
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/v03_contract.py
          python tests/v03_runtime_fix_contract.py
          python tests/v03_customer_scope_contract.py
          python tests/v03_safety_foxmail_contract.py
          python tests/v03_payment_template_contract.py
          python tests/v031_payment_workflow_contract.py
          python tests/v031_windows_bootstrap_contract.py
          python tests/v032_customer_import_contract.py
          python tests/v032_customer_exchange_contract.py

      - name: Production regressions
        if: steps.scope.outputs.mode == 'full'
        run: |
          python tests/production_experience_regression.py
          node tests/navigation_transitions_contract.cjs
          node tests/payment_export_readiness_contract.cjs
          python tests/promotion_slots_contract.py
          python tests/promotion_render_regression.py
          python tests/promotion_rename_route_regression.py

      - name: v1.2 recipe tools browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v12_recipe_tools_acceptance.py

      - name: v1.2 workspace isolation acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v10_workspace_isolation_acceptance.py

      - name: v1.2.8 table finder / exact-number landing acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v124_payment_search_acceptance.py

      - name: v1.2.6 workflow rollback acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v126_payment_workflow_rollback_acceptance.py

      - name: v1.2.7 stale-UI server-first rollback acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v127_server_first_rollback_acceptance.py

      - name: v1.3 remote customer documents acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v13_customer_documents_acceptance.py

      - name: v1.4.2 navigation and row-review acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v141_navigation_review_acceptance.py

      - name: v1.4.3 centered navigation and customer status acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v143_customer_status_acceptance.py

      - name: v1.5 customer live refresh acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v150_live_refresh_acceptance.py

      - name: v1.5.2 high-frequency payment flow acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v152_high_frequency_flow_acceptance.py

      - name: v1.5.11 three-stage payment dashboard acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v1511_payment_dashboard_acceptance.py

      - name: v1.6.0 information center acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v160_information_center_acceptance.py

      - name: v1.6.1 responsive desktop/mobile acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v161_responsive_polish_acceptance.py

      - name: Legacy customer import browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v032_customer_import_acceptance.py

      - name: Legacy customer browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v031_legacy_customer_acceptance.py

      - name: Legacy runtime-fix browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v03_runtime_fix_acceptance.py

      - name: Legacy insert-order browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v03_insert_order_acceptance.py

      - name: Legacy review-reset browser acceptance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/v03_review_reset_acceptance.py


  production_deploy_preflight:
    name: production deploy preflight
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: [self-hosted, linux, x64, chen-assistant]
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
    steps:
      - name: Detect production access mode
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_DIR="/opt/chen-assistant"
          if [[ -d "$APP_DIR/.git" && -f "$APP_DIR/.env" ]] && systemctl cat chen-assistant >/dev/null 2>&1; then
            echo "LOCAL_PRODUCTION_AVAILABLE=yes"
            if [[ "$(id -u)" == "0" ]]; then
              echo "LOCAL_DEPLOY_PRIVILEGE=root"
            elif sudo -n true >/dev/null 2>&1; then
              echo "LOCAL_DEPLOY_PRIVILEGE=passwordless-sudo"
            else
              echo "LOCAL_DEPLOY_PRIVILEGE=insufficient"
              echo "Remote SSH deployment secrets will be required after merge."
            fi
          else
            echo "LOCAL_PRODUCTION_AVAILABLE=no"
            echo "Remote SSH deployment secrets will be required after merge."
          fi

          if [[ -n "${PROD_HOST:-}" && -n "${PROD_USER:-}" && -n "${PROD_SSH_KEY:-}" && -n "${PROD_KNOWN_HOSTS:-}" ]]; then
            echo "REMOTE_DEPLOY_SECRETS=complete"
          else
            echo "REMOTE_DEPLOY_SECRETS=incomplete"
          fi

  deploy_stability:
    name: production stability recheck
    needs: validate
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Recheck production stability contract
        run: |
          python -m compileall -q app tests/stability_contract.py
          python tests/stability_contract.py

  deploy_production:
    name: deploy production
    needs: [validate, deploy_stability]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, chen-assistant]
    concurrency:
      group: chen-assistant-production
      cancel-in-progress: false
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether Web production needs deployment
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy=0
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            deploy=1
            echo "Manual main deployment requested."
          else
            git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" > /tmp/chen-production-changed.txt
            echo "Main changes:"
            cat /tmp/chen-production-changed.txt
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                app/*|storage_node/*|requirements.txt|deploy.sh)
                  deploy=1
                  break
                  ;;
              esac
            done < /tmp/chen-production-changed.txt
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Deploy exact validated main revision
        if: steps.scope.outputs.deploy == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_SHA="$GITHUB_SHA"
          APP_DIR="/opt/chen-assistant"

          if [[ -d "$APP_DIR/.git" && -f "$APP_DIR/.env" ]] && systemctl cat chen-assistant >/dev/null 2>&1; then
            if [[ "$(id -u)" == "0" ]]; then
              echo "Using local production checkout as root."
              cd "$APP_DIR"
              git fetch origin main
              git show "$TARGET_SHA:deploy.sh" > /tmp/chen-deploy.sh
              chmod 700 /tmp/chen-deploy.sh
              CHEN_DEPLOY_TARGET_REV="$TARGET_SHA" bash /tmp/chen-deploy.sh
              exit 0
            elif sudo -n true >/dev/null 2>&1; then
              echo "Using local production checkout with passwordless sudo."
              sudo -n bash -lc "cd '$APP_DIR'; git fetch origin main; git show '$TARGET_SHA:deploy.sh' > /tmp/chen-deploy.sh; chmod 700 /tmp/chen-deploy.sh; CHEN_DEPLOY_TARGET_REV='$TARGET_SHA' bash /tmp/chen-deploy.sh"
              exit 0
            fi
            echo "Local production checkout found but deploy privilege is insufficient; falling back to SSH."
          fi

          PORT="${PROD_PORT:-22}"
          if [[ -z "${PROD_HOST:-}" || -z "${PROD_USER:-}" || -z "${PROD_SSH_KEY:-}" || -z "${PROD_KNOWN_HOSTS:-}" ]]; then
            echo "Production is not locally deployable and remote SSH secrets are incomplete."
            echo "Direct CI deployment deferred to the production-side chen-assistant-auto-deploy.timer."
            echo "One-time timer bootstrap is required on production before this fallback becomes active."
            exit 0
          fi

          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          KEY="$SSH_DIR/key"
          KNOWN="$SSH_DIR/known_hosts"
          printf '%s\n' "$PROD_SSH_KEY" > "$KEY"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$KNOWN"
          chmod 600 "$KEY" "$KNOWN"

          ssh -i "$KEY" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN" "${PROD_USER}@${PROD_HOST}"             "set -Eeuo pipefail; cd '$APP_DIR'; git fetch origin main; TMP=\$(mktemp); trap 'rm -f "\$TMP"' EXIT; git show '$TARGET_SHA:deploy.sh' > "\$TMP"; chmod 700 "\$TMP"; CHEN_DEPLOY_TARGET_REV='$TARGET_SHA' bash "\$TMP""

      - name: Deployment skipped
        if: steps.scope.outputs.deploy != '1'
        run: echo "No Web runtime files changed; production deployment skipped."



