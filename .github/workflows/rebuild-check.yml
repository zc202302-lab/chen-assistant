name: v1.2 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt playwright httpx

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          for asset in \
            app/static/app.js \
            app/static/v028.js \
            app/static/ui-drag.js \
            app/static/service-promotions.js \
            app/static/business-sync.js \
            app/static/v0211.js \
            app/static/workspace-refinement-v0212.js \
            app/static/v03.js \
            app/static/v03_runtime_fix.js \
            app/static/v03_business_mail.js \
            app/static/v03_payment_template.js \
            app/static/v03_foxmail_action_fix.js \
            app/static/v03_insert_order.js \
            app/static/v03_review_reset.js \
            app/static/v031_payment_workflow.js \
            app/static/v031_amount_rollback_fix.js \
            app/static/v031_workflow_actions.js \
            app/static/v031_workflow_runtime_fix.js \
            app/static/v031_workflow_dom_guard.js \
            app/static/v031_windows_bootstrap.js \
            app/static/v033_payment_flow_patch.js \
            app/static/v10.js \
            app/static/v12.js \
            app/static/v124_work_tables.js \
            app/static/recipe-print-v101.js
          do
            node --check "$asset"
          done

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: v1.2 architecture and recipe tools contracts
        run: |
          python tests/stability_contract.py
          python tests/v12_contract.py

      - name: Legacy work-system compatibility contracts
        run: |
          python tests/v03_contract.py
          python tests/v03_runtime_fix_contract.py
          python tests/v03_customer_scope_contract.py
          python tests/v03_safety_foxmail_contract.py
          python tests/v03_payment_template_contract.py
          python tests/v031_payment_workflow_contract.py
          python tests/v031_windows_bootstrap_contract.py
          python tests/v032_customer_import_contract.py
          python tests/v032_customer_exchange_contract.py

      - name: Production regressions
        run: |
          python tests/production_experience_regression.py
          python tests/promotion_render_regression.py
          python tests/promotion_rename_route_regression.py

      - name: v1.2 recipe tools browser acceptance
        run: python tests/v12_recipe_tools_acceptance.py

      - name: v1.2 workspace isolation acceptance
        run: python tests/v10_workspace_isolation_acceptance.py

      - name: v1.2.4 payment/search/table acceptance
        run: python tests/v124_payment_search_acceptance.py

      - name: Legacy work-system browser acceptance
        run: |
          python tests/v032_customer_import_acceptance.py
          python tests/v031_payment_workflow_acceptance.py
          python tests/v031_legacy_customer_acceptance.py
          python tests/v03_runtime_fix_acceptance.py
          python tests/v03_insert_order_acceptance.py
          python tests/v03_review_reset_acceptance.py
