name: v0.2.12 validation

on:
  push:
    branches: [main, v0.2.12-dev]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_USERNAME: ui-test
      APP_PASSWORD_SALT: dGVzdHNhbHQ=
      APP_PASSWORD_HASH: not-used-by-this-test
      APP_SESSION_SECRET: ui-test-session-secret
      APP_ENCRYPTION_KEY: not-used-by-this-test
      APP_SECURE_COOKIE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt playwright httpx
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/v028.js
          node --check app/static/ui-drag.js
          node --check app/static/service-promotions.js
          node --check app/static/business-sync.js
          node --check app/static/v0211.js
          node --check app/static/v0212.js
      - name: Check Python, routes, templates and assets
        run: |
          python -m compileall -q app
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          from app import config
          from app.main import app
          assert app.version == '0.2.12'
          for path in ('/', '/customers/{customer_id}', '/health'):
              matches=[r for r in app.router.routes if getattr(r,'path','')==path]
              assert len(matches)==1,(path,len(matches))
          customer_route=next(r for r in app.router.routes if getattr(r,'path','')=='/customers/{customer_id}')
          assert customer_route.endpoint.__module__=='app.v0212_routes'
          for path,method in (
              ('/customers/{customer_id}/payment-run','POST'),
              ('/customers/{customer_id}/payment.txt','GET'),
              ('/services/{service_id}/defer-v0212','POST'),
              ('/services/{service_id}/delete-v0212','POST'),
          ):
              matches=[r for r in app.router.routes if getattr(r,'path','')==path and method in getattr(r,'methods',set())]
              assert matches,(path,method)
              assert matches[0].endpoint.__module__=='app.v0212_routes',(path,matches[0].endpoint.__module__)
          env=Environment(loader=FileSystemLoader(str(config.ROOT/'app'/'templates')))
          runtime_templates=('base.html','dashboard_v027.html','customer_workspace_v0211.html','account_detail.html','account_form.html','accounts.html','customer_form.html','login.html','search.html')
          for name in runtime_templates:
              p=config.ROOT/'app'/'templates'/name
              if not p.exists(): continue
              env.get_template(name)
              text=p.read_text(encoding='utf-8')
              assert 'type="date"' not in text and "type='date'" not in text,name
          base=(config.ROOT/'app'/'templates'/'base.html').read_text(encoding='utf-8')
          for current in ('/static/app.js','/static/v028.js','/static/ui-drag.js','/static/service-promotions.js','/static/business-sync.js','/static/v0211.js','/static/v0212.js','/static/app.css','/static/v028.css','/static/layout-refinement.css','/static/v0212.css'):
              assert base.count(current)==1,current
          for old in ('/static/current.js','/static/v025.js','/static/v025_minor.js','/static/v026.js','/static/v027.js','/static/v02.css','/static/v021.css','/static/v022.css','/static/v023.css','/static/v024.css','/static/v025.css','/static/v026.css','/static/v027.css'):
              assert old not in base,old
          print('static validation passed: v0.2.12 runtime assets + no runtime date picker')
          PY
      - name: v0.2.12 schedule and module-display contract
        run: python tests/ui_v0212_contract.py
      - name: Production experience regression
        run: python tests/production_experience_regression.py
      - name: Promotion render regression
        run: python tests/promotion_render_regression.py
      - name: Promotion bidirectional route regression
        run: python tests/promotion_rename_route_regression.py
      - name: v0.2.12 browser acceptance
        run: python tests/ui_v0212_acceptance.py
