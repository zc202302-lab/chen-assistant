name: stability gate

on:
  push:
    branches: [main, v0.3-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stability:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests/stability_contract.py
      - name: Version, health and SQLite stability contract
        run: python tests/stability_contract.py

  verify-win-assistants-v054-production:
    if: github.event_name == 'pull_request' && github.head_ref == 'verify/win-assistants-v054-production'
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - name: Verify public updater v0.5.4
        run: |
          set -Eeuo pipefail
          update_url="https://assistant.ziboxiaozhushou.cn/static/win-assistants/update.json?verify=$(date +%s)"
          exe_url="https://assistant.ziboxiaozhushou.cn/static/win-assistants/win-assistants.exe?verify=$(date +%s)"

          for attempt in 1 2 3 4 5 6; do
            if update="$(curl --fail --silent --show-error --max-time 20 "$update_url")" &&
               python3 - "$update" <<'PY'
          import json, sys
          update = json.loads(sys.argv[1])
          assert update.get("version") == "0.5.4", update
          assert update.get("sha256") == "f64069e77af4e76878ac3d36b862c5f2c2dcc7a39e4fa33d68e66cdbd5861d70", update
          assert int(update.get("size", 0)) == 71630014, update
          print("update", update)
          PY
            then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "public updater did not reach v0.5.4" >&2
              exit 1
            fi
            sleep 20
          done

          exe="$RUNNER_TEMP/win-assistants-v054-public.exe"
          curl --fail --location --silent --show-error --max-time 240 "$exe_url" -o "$exe"
          test "$(stat -c '%s' "$exe")" = "71630014"
          echo "f64069e77af4e76878ac3d36b862c5f2c2dcc7a39e4fa33d68e66cdbd5861d70  $exe" | sha256sum --check
          python3 - "$exe" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert p.read_bytes()[:2] == b"MZ"
          print("public EXE verified", p.stat().st_size)
          PY

