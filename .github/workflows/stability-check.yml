name: stability gate

on:
  push:
    branches: [main, v0.3-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stability:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests/stability_contract.py
      - name: Version, health and SQLite stability contract
        run: python tests/stability_contract.py

  verify-production-v162:
    if: github.event_name == 'pull_request' && github.head_ref == 'verify/production-v162'
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - name: Verify production health is v1.6.2
        run: |
          set -Eeuo pipefail
          url="https://assistant.ziboxiaozhushou.cn/health?verify=$(date +%s)"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 "$url" |
              python3 -c "import json,sys; p=json.load(sys.stdin); assert p.get('ok') is True; assert p.get('version') == '1.6.2', p; print(p)"; then
              exit 0
            fi
            sleep 20
          done
          echo "production /health did not reach v1.6.2" >&2
          exit 1
