name: Windows Foxmail helper validation

on:
  push:
    branches: [main, v0.3-dev]
    paths:
      - 'app/static/chen_foxmail_helper.ps1'
      - 'app/static/chen_foxmail_helper_v06.ps1'
      - 'app/static/chen_foxmail_helper_v07.ps1'
      - 'app/static/chen_foxmail_helper_v08.ps1'
      - 'app/static/chen_foxmail_helper_v09.ps1'
      - 'app/static/chen_foxmail_bootstrap.ps1'
      - 'windows/**'
      - '.github/workflows/windows-foxmail-helper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/static/chen_foxmail_helper.ps1'
      - 'app/static/chen_foxmail_helper_v06.ps1'
      - 'app/static/chen_foxmail_helper_v07.ps1'
      - 'app/static/chen_foxmail_helper_v08.ps1'
      - 'app/static/chen_foxmail_helper_v09.ps1'
      - 'app/static/chen_foxmail_bootstrap.ps1'
      - 'windows/**'
      - '.github/workflows/windows-foxmail-helper.yml'
  workflow_dispatch:

jobs:
  powershell-51:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse helpers and bootstrap with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @(
            'app/static/chen_foxmail_helper.ps1',
            'app/static/chen_foxmail_helper_v06.ps1',
            'app/static/chen_foxmail_helper_v07.ps1',
            'app/static/chen_foxmail_helper_v08.ps1',
            'app/static/chen_foxmail_helper_v09.ps1',
            'app/static/chen_foxmail_bootstrap.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List *
              throw "Windows PowerShell 5.1 parse failed for $path with $($errors.Count) error(s)."
            }
            Write-Host "Windows PowerShell 5.1 syntax check passed: $path"
          }
      - name: Verify downloadable helper scripts stay ASCII-safe
        shell: powershell
        run: |
          foreach ($path in @(
            'app/static/chen_foxmail_helper.ps1',
            'app/static/chen_foxmail_helper_v06.ps1',
            'app/static/chen_foxmail_helper_v07.ps1',
            'app/static/chen_foxmail_helper_v08.ps1',
            'app/static/chen_foxmail_helper_v09.ps1',
            'app/static/chen_foxmail_bootstrap.ps1'
          )) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$path contains non-ASCII bytes. Keep downloadable PowerShell 5.1 scripts ASCII-only."
            }
            Write-Host "ASCII compatibility check passed: $path"
          }
