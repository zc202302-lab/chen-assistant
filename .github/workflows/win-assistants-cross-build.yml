name: win-assistants cross build

on:
  pull_request:
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  push:
    branches: [main]
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test
        run: |
          python -m compileall -q main.py win_assistants tests
          python -m unittest discover -s tests -v

  build-windows-exe:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable Wine
        run: |
          wine_root="${RUNNER_TEMP}/win-assistants-wine"
          mkdir -p "${wine_root}/debs" "${wine_root}/root"
          cd "${wine_root}/debs"
          apt-get download xvfb xserver-common
          for package in ./*.deb; do
            dpkg-deb --extract "${package}" "${wine_root}/root"
          done
          wine_archive="${wine_root}/wine-11.18-staging-tkg-amd64-wow64.tar.xz"
          curl --fail --location --retry 3 --output "${wine_archive}" \
            "https://github.com/Kron4ek/Wine-Builds/releases/download/11.18/wine-11.18-staging-tkg-amd64-wow64.tar.xz"
          echo "a903e2c6f555ee897e764b3525f1163c8ca129fd257933ea570d4070bf47e1c3  ${wine_archive}" \
            | sha256sum --check
          tar -xJf "${wine_archive}" -C "${wine_root}/root"
          wine_bin="$(find "${wine_root}/root" -path '*/bin/wine' -type f -print -quit)"
          wineserver_bin="$(find "${wine_root}/root" -path '*/bin/wineserver' -type f -print -quit)"
          wineboot_bin="$(find "${wine_root}/root" -path '*/bin/wineboot' -print -quit)"
          wine_prefix="${RUNNER_TEMP}/win-assistants-wine-prefix"
          xvfb_bin="${wine_root}/root/usr/bin/Xvfb"
          test -x "${wine_bin}"
          test -x "${wineserver_bin}"
          test -x "${wineboot_bin}"
          test -x "${xvfb_bin}"
          echo "WINE_BIN=${wine_bin}" >> "${GITHUB_ENV}"
          echo "WINESERVER=${wineserver_bin}" >> "${GITHUB_ENV}"
          echo "WINEARCH=win64" >> "${GITHUB_ENV}"
          echo 'WINEDLLOVERRIDES=winemenubuilder.exe=d;mscoree,mshtml=' >> "${GITHUB_ENV}"
          echo "WINEPREFIX=${wine_prefix}" >> "${GITHUB_ENV}"
          "${xvfb_bin}" :99 -screen 0 1024x768x24 -nolisten tcp \
            > "${RUNNER_TEMP}/win-assistants-xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "${GITHUB_ENV}"
          for attempt in {1..20}; do
            test -S /tmp/.X11-unix/X99 && break
            sleep 0.25
          done
          test -S /tmp/.X11-unix/X99
          export DISPLAY=:99
          export WINEPREFIX="${wine_prefix}"
          export WINEARCH=win64
          export WINESERVER="${wineserver_bin}"
          export WINEDLLOVERRIDES='winemenubuilder.exe=d;mscoree,mshtml='
          timeout 180s "${wineboot_bin}" --init
          timeout 30s "${wineserver_bin}" -w || true
      - name: Prepare full Windows Python with Tcl/Tk
        run: |
          python_installer="${RUNNER_TEMP}/python-3.12.10-amd64.exe"
          curl --fail --location --retry 3 \
            --output "${python_installer}" \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
          timeout 300s "$WINE_BIN" "${python_installer}" /quiet \
            InstallAllUsers=0 \
            TargetDir=C:\\win-assistants-python \
            Include_launcher=0 Include_test=0 Include_doc=0 Include_debug=0 Include_symbols=0 \
            Include_pip=0 Include_tcltk=1 PrependPath=0 Shortcuts=0
          timeout 30s "$WINESERVER" -w || true

          windows_python="${WINEPREFIX}/drive_c/win-assistants-python"
          test -f "${windows_python}/python.exe"
          test -f "${windows_python}/Lib/tkinter/__init__.py"
          test -d "${windows_python}/tcl/tk8.6"

          windows_wheels="${RUNNER_TEMP}/win-assistants-wheels"
          mkdir -p "${windows_python}/Lib/site-packages" "${windows_wheels}"
          python3 -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform win_amd64 --python-version 312 --implementation cp --abi cp312 \
            --dest "${windows_wheels}" -r requirements.txt \
            "pefile>=2022.5.30" "pywin32-ctypes>=0.2.1"
          for wheel in "${windows_wheels}"/*.whl; do
            python3 -m zipfile -e "${wheel}" "${windows_python}/Lib/site-packages"
          done
          cp -R win_assistants "${windows_python}/win_assistants"

          echo "WINDOWS_PYTHON=${windows_python}/python.exe" >> "${GITHUB_ENV}"
          echo "WINDOWS_WHEELS=${windows_wheels}" >> "${GITHUB_ENV}"
          "$WINE_BIN" --version
          timeout 120s "$WINE_BIN" "${windows_python}/python.exe" --version
          timeout 120s "$WINE_BIN" "${windows_python}/python.exe" -c \
            "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy(); print('Tk runtime ready')"
      - name: Verify Windows build dependencies
        run: >-
          timeout 120s "$WINE_BIN" "$WINDOWS_PYTHON" -c
          "import PIL, pystray; from win32ctypes.pywin32 import pywintypes, win32api;
          import PyInstaller; print('Windows build dependencies ready')"
      - name: Test with Windows Python
        run: |
          "$WINE_BIN" "$WINDOWS_PYTHON" -m compileall -q main.py win_assistants tests
          "$WINE_BIN" "$WINDOWS_PYTHON" -m unittest discover -s tests -v
      - name: Build Windows executable
        run: >-
          "$WINE_BIN" "$WINDOWS_PYTHON" -m PyInstaller --noconfirm --clean --onefile --windowed
          --name win-assistants --collect-submodules pystray
          --hidden-import PIL.Image --hidden-import PIL.ImageDraw main.py
      - name: Smoke launch built executable
        run: |
          set +e
          timeout 8s "$WINE_BIN" dist/win-assistants.exe --background
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "win-assistants.exe exited during GUI smoke test (status=$status)"
            exit 1
          fi
          timeout 30s "$WINESERVER" -k || true
      - name: Verify PE executable
        run: |
          test -s dist/win-assistants.exe
          file dist/win-assistants.exe | tee dist/file-type.txt
          grep -q "PE32" dist/file-type.txt
          sha256sum dist/win-assistants.exe | tee dist/win-assistants.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-assistants-windows
          path: |
            windows/win-assistants/dist/win-assistants.exe
            windows/win-assistants/dist/win-assistants.exe.sha256
          if-no-files-found: error

      - name: Publish updater files to production static directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          publish_root="/opt/chen-assistant/app/static/win-assistants"
          test -d "/opt/chen-assistant/app/static"
          mkdir -p "$publish_root"

          version="$(
            python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("win_assistants/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("version not found")
          print(match.group(1))
          PY
          )"
          sha="$(sha256sum dist/win-assistants.exe | awk '{print $1}')"
          size="$(stat -c '%s' dist/win-assistants.exe)"

          temp_exe="$publish_root/win-assistants.exe.new"
          install -m 0755 dist/win-assistants.exe "$temp_exe"
          test "$(sha256sum "$temp_exe" | awk '{print $1}')" = "$sha"
          mv -f "$temp_exe" "$publish_root/win-assistants.exe"

          python3 - "$publish_root/update.json.new" "$version" "$sha" "$size" <<'PY'
          import json
          import sys
          from pathlib import Path

          target, version, sha256, size = sys.argv[1:]
          payload = {
              "version": version,
              "exe_url": "https://assistant.ziboxiaozhushou.cn/static/win-assistants/win-assistants.exe",
              "sha256": sha256,
              "size": int(size),
              "notes": "统一更新：win-assistants、内置短信与 Foxmail；同时触发久坐助手更新检查。",
          }
          Path(target).write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          mv -f "$publish_root/update.json.new" "$publish_root/update.json"

          curl --fail --silent --show-error --max-time 10             "https://assistant.ziboxiaozhushou.cn/static/win-assistants/update.json?verify=$GITHUB_SHA"             | python3 -c "import json,sys; p=json.load(sys.stdin); assert p['version']=='$version'; assert p['sha256']=='$sha'; assert int(p['size'])==$size"

          remote_sha="$(
            curl --fail --silent --show-error --max-time 60               "https://assistant.ziboxiaozhushou.cn/static/win-assistants/win-assistants.exe?verify=$GITHUB_SHA"               | sha256sum | awk '{print $1}'
          )"
          test "$remote_sha" = "$sha"
          echo "Published win-assistants v$version ($sha)"
