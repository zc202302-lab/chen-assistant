name: win-assistants cross build

permissions:
  contents: write
  statuses: write

on:
  pull_request:
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  push:
    branches: [main]
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test
        run: |
          python -m compileall -q main.py win_assistants sedentary tests
          python -m unittest discover -s tests -v

  build-windows-exe:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable Wine
        run: |
          wine_root="${RUNNER_TEMP}/win-assistants-wine"
          mkdir -p "${wine_root}/debs" "${wine_root}/root"
          cd "${wine_root}/debs"
          apt-get download \
            xvfb xserver-common \
            libgl1 libglx0 libglvnd0 libpixman-1-0 \
            libxfont2 libfontenc1 libxau6 libxdmcp6 libxcb1 libxshmfence1 \
            libx11-6 libxext6 x11-xkb-utils xkb-data
          for package in ./*.deb; do
            dpkg-deb --extract "${package}" "${wine_root}/root"
          done
          portable_lib="${wine_root}/root/usr/lib/x86_64-linux-gnu"
          export LD_LIBRARY_PATH="${portable_lib}:${LD_LIBRARY_PATH:-}"
          export XKB_BINDIR="${wine_root}/root/usr/bin"
          export XKB_CONFIG_ROOT="${wine_root}/root/usr/share/X11/xkb"
          export PATH="${wine_root}/root/usr/bin:${PATH}"

          # Prefer system Xvfb when complete. On minimal self-hosted runners
          # without root/sudo, use the downloaded portable copy. Ubuntu's Xvfb
          # embeds /usr/bin/xkbcomp, so rewrite that fixed path to an equal-
          # length writable path and expose the portable xkbcomp there.
          if [ -x /usr/bin/Xvfb ] && [ -x /usr/bin/xkbcomp ]; then
            xvfb_bin="/usr/bin/Xvfb"
          else
            xvfb_bin="${wine_root}/root/usr/bin/Xvfb"
            portable_xkbcomp="${wine_root}/root/usr/bin/xkbcomp"
            test -x "${xvfb_bin}"
            test -x "${portable_xkbcomp}"
            mkdir -p /tmp/bin
            ln -sf "${portable_xkbcomp}" /tmp/bin/xkbcomp
            python3 - "${xvfb_bin}" <<'PY'
from pathlib import Path
import sys

target = Path(sys.argv[1])
data = target.read_bytes()
old = b"/usr/bin/xkbcomp"
new = b"/tmp/bin/xkbcomp"
if len(old) != len(new):
    raise SystemExit("replacement path length mismatch")
if old in data:
    target.write_bytes(data.replace(old, new))
elif new not in data:
    raise SystemExit("Xvfb xkbcomp path marker not found")
PY
          fi

          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          echo "XKB_BINDIR=${XKB_BINDIR}" >> "${GITHUB_ENV}"
          echo "XKB_CONFIG_ROOT=${XKB_CONFIG_ROOT}" >> "${GITHUB_ENV}"
          echo "PATH=${PATH}" >> "${GITHUB_ENV}"
          wine_archive="${wine_root}/wine-11.18-staging-tkg-amd64-wow64.tar.xz"
          curl --fail --location --retry 3 --output "${wine_archive}" \
            "https://github.com/Kron4ek/Wine-Builds/releases/download/11.18/wine-11.18-staging-tkg-amd64-wow64.tar.xz"
          echo "a903e2c6f555ee897e764b3525f1163c8ca129fd257933ea570d4070bf47e1c3  ${wine_archive}" \
            | sha256sum --check
          tar -xJf "${wine_archive}" -C "${wine_root}/root"
          wine_bin="$(find "${wine_root}/root" -path '*/bin/wine' -type f -print -quit)"
          wineserver_bin="$(find "${wine_root}/root" -path '*/bin/wineserver' -type f -print -quit)"
          wineboot_bin="$(find "${wine_root}/root" -path '*/bin/wineboot' -print -quit)"
          wine_prefix="${RUNNER_TEMP}/win-assistants-wine-prefix"
          echo "Portable Wine paths:"
          echo "  wine=${wine_bin}"
          echo "  wineserver=${wineserver_bin}"
          echo "  wineboot=${wineboot_bin}"
          echo "  xvfb=${xvfb_bin}"
          test -x "${wine_bin}"
          test -x "${wineserver_bin}"
          test -x "${wineboot_bin}"
          test -x "${xvfb_bin}"
          ldd "${wine_bin}" || true
          ldd "${wineboot_bin}" || true
          ldd "${xvfb_bin}" || true
          "${wine_bin}" --version
          echo "WINE_BIN=${wine_bin}" >> "${GITHUB_ENV}"
          echo "WINESERVER=${wineserver_bin}" >> "${GITHUB_ENV}"
          echo "WINEARCH=win64" >> "${GITHUB_ENV}"
          echo 'WINEDLLOVERRIDES=winemenubuilder.exe=d;mscoree,mshtml=' >> "${GITHUB_ENV}"
          echo "WINEPREFIX=${wine_prefix}" >> "${GITHUB_ENV}"
          "${xvfb_bin}" :99 -screen 0 1024x768x24 -nolisten tcp \
            > "${RUNNER_TEMP}/win-assistants-xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "${GITHUB_ENV}"
          for attempt in {1..20}; do
            test -S /tmp/.X11-unix/X99 && break
            sleep 0.25
          done
          if ! test -S /tmp/.X11-unix/X99; then
            echo "Xvfb failed to start:" >&2
            cat "${RUNNER_TEMP}/win-assistants-xvfb.log" >&2 || true
            exit 1
          fi
          export DISPLAY=:99
          export WINEPREFIX="${wine_prefix}"
          export WINEARCH=win64
          export WINESERVER="${wineserver_bin}"
          export WINEDLLOVERRIDES='winemenubuilder.exe=d;mscoree,mshtml='
          if ! timeout 180s "${wineboot_bin}" --init; then
            echo "wineboot initialization failed on this runner" >&2
            exit 1
          fi
          timeout 30s "${wineserver_bin}" -w || true
      - name: Prepare full Windows Python with Tcl/Tk
        run: |
          python_installer="${RUNNER_TEMP}/python-3.12.10-amd64.exe"
          curl --fail --location --retry 3 \
            --output "${python_installer}" \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
          timeout 300s "$WINE_BIN" "${python_installer}" /quiet \
            InstallAllUsers=0 \
            TargetDir=C:\\win-assistants-python \
            Include_launcher=0 Include_test=0 Include_doc=0 Include_debug=0 Include_symbols=0 \
            Include_pip=0 Include_tcltk=1 PrependPath=0 Shortcuts=0
          timeout 30s "$WINESERVER" -w || true

          windows_python="${WINEPREFIX}/drive_c/win-assistants-python"
          test -f "${windows_python}/python.exe"
          test -f "${windows_python}/Lib/tkinter/__init__.py"
          test -d "${windows_python}/tcl/tk8.6"

          windows_wheels="${RUNNER_TEMP}/win-assistants-wheels"
          mkdir -p "${windows_python}/Lib/site-packages" "${windows_wheels}"
          python3 -m pip download --disable-pip-version-check --only-binary=:all: \
            --platform win_amd64 --python-version 312 --implementation cp --abi cp312 \
            --dest "${windows_wheels}" -r requirements.txt \
            "pefile>=2022.5.30" "pywin32-ctypes>=0.2.1"
          for wheel in "${windows_wheels}"/*.whl; do
            python3 -m zipfile -e "${wheel}" "${windows_python}/Lib/site-packages"
          done
          cp -R win_assistants "${windows_python}/win_assistants"
          cp -R sedentary "${windows_python}/sedentary"

          echo "WINDOWS_PYTHON=${windows_python}/python.exe" >> "${GITHUB_ENV}"
          echo "WINDOWS_WHEELS=${windows_wheels}" >> "${GITHUB_ENV}"
          "$WINE_BIN" --version
          timeout 120s "$WINE_BIN" "${windows_python}/python.exe" --version
          timeout 120s "$WINE_BIN" "${windows_python}/python.exe" -c \
            "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy(); print('Tk runtime ready')"
      - name: Verify Windows build dependencies
        run: >-
          timeout 120s "$WINE_BIN" "$WINDOWS_PYTHON" -c
          "import cv2, PIL, pystray; from win32ctypes.pywin32 import pywintypes, win32api;
          import PyInstaller; print('Windows build dependencies ready')"
      - name: Test with Windows Python
        run: |
          "$WINE_BIN" "$WINDOWS_PYTHON" -m compileall -q main.py win_assistants sedentary tests
          "$WINE_BIN" "$WINDOWS_PYTHON" -m unittest discover -s tests -v
      - name: Build Windows executable
        run: >-
          "$WINE_BIN" "$WINDOWS_PYTHON" -m PyInstaller --noconfirm --clean --onefile --windowed
          --name win-assistants --collect-submodules pystray --collect-data cv2
          --hidden-import PIL.Image --hidden-import PIL.ImageDraw main.py
      - name: Smoke launch built executable
        run: |
          set +e
          timeout 8s "$WINE_BIN" dist/win-assistants.exe --background
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "win-assistants.exe exited during GUI smoke test (status=$status)"
            exit 1
          fi
          timeout 30s "$WINESERVER" -k || true
      - name: Verify PE executable
        run: |
          test -s dist/win-assistants.exe
          file dist/win-assistants.exe | tee dist/file-type.txt
          grep -q "PE32" dist/file-type.txt
          sha256sum dist/win-assistants.exe | tee dist/win-assistants.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-assistants-windows
          path: |
            windows/win-assistants/dist/win-assistants.exe
            windows/win-assistants/dist/win-assistants.exe.sha256
          if-no-files-found: error

      - name: Publish updater release branch
        id: publish_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(
            python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("win_assistants/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("version not found")
          print(match.group(1))
          PY
          )"
          sha="$(sha256sum dist/win-assistants.exe | awk '{print $1}')"
          size="$(stat -c '%s' dist/win-assistants.exe)"
          release_dir="$RUNNER_TEMP/win-assistants-release-assets"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          cp dist/win-assistants.exe "$release_dir/win-assistants.exe"

          python3 - "$release_dir/update.json" "$version" "$sha" "$size" <<'PY'
          import json
          import sys
          from pathlib import Path

          target, version, sha256, size = sys.argv[1:]
          payload = {
              "version": version,
              "exe_url": "https://assistant.ziboxiaozhushou.cn/static/win-assistants/win-assistants.exe",
              "sha256": sha256,
              "size": int(size),
              "notes": "v0.5.0：短信、久坐与 Foxmail 已统一内置到 win-assistants，同一 EXE、同一开机入口、同一更新链。",
          }
          Path(target).write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "win-assistants-release:refs/remotes/origin/win-assistants-release" || true

          export GIT_INDEX_FILE="$RUNNER_TEMP/win-assistants-release.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          exe_blob="$(git hash-object -w "$release_dir/win-assistants.exe")"
          json_blob="$(git hash-object -w "$release_dir/update.json")"
          git update-index --add --cacheinfo "100644,$exe_blob,win-assistants.exe"
          git update-index --add --cacheinfo "100644,$json_blob,update.json"
          tree="$(git write-tree)"

          parent_args=()
          if git rev-parse --verify --quiet refs/remotes/origin/win-assistants-release >/dev/null; then
            parent="$(git rev-parse refs/remotes/origin/win-assistants-release)"
            parent_args=(-p "$parent")
          fi
          commit="$(printf 'release: win-assistants v%s\n' "$version" | git commit-tree "$tree" "${parent_args[@]}")"
          git push origin "$commit:refs/heads/win-assistants-release"

          echo "Published release branch win-assistants v$version ($sha)"

      - name: Report updater release status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          state="failure"
          description="win-assistants release asset publish failed"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            state="success"
            description="win-assistants release assets published"
          fi
          payload="$(python3 - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "win-assistants/release-assets",
              "description": sys.argv[2],
          }, separators=(",", ":")))
          PY
          )"
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "$payload"
