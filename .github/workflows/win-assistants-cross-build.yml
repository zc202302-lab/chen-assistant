name: win-assistants cross build

permissions:
  contents: write
  statuses: write

on:
  pull_request:
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  push:
    branches: [main]
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test
        run: |
          python -m compileall -q main.py win_assistants sedentary tests
          python -m unittest discover -s tests -v

  build-windows-exe:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows build dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Test with native Windows Python
        run: |
          python -m compileall -q main.py win_assistants sedentary tests
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Windows source tests failed" }
          python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
          if ($LASTEXITCODE -ne 0) { throw "Tk runtime validation failed" }
      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name win-assistants --collect-submodules pystray --collect-data cv2 --hidden-import PIL.Image --hidden-import PIL.ImageDraw main.py
          if ($LASTEXITCODE -ne 0) { throw "EXE build failed" }
      - name: Smoke test bundled models and Python startup
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'models-startup-ready.txt'
          $process = Start-Process -FilePath 'dist/win-assistants.exe' -ArgumentList @('--smoke-test', ('"' + $marker + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Bundled model startup timed out"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "Bundled models failed startup" }
          if ((Get-Content $marker -Raw) -ne 'ready') { throw "Invalid startup marker" }
      - name: Verify PE executable
        run: |
          python -c "from pathlib import Path; p=Path('dist/win-assistants.exe'); assert p.read_bytes()[:2] == b'MZ'"
          if ($LASTEXITCODE -ne 0) { throw "Invalid Windows executable" }
          $digest = (Get-FileHash dist/win-assistants.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  win-assistants.exe" | Set-Content dist/win-assistants.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-assistants-windows
          retention-days: 3
          path: |
            windows/win-assistants/dist/win-assistants.exe
            windows/win-assistants/dist/win-assistants.exe.sha256
          if-no-files-found: error

  windows-update-validation:
    needs: build-windows-exe
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: win-assistants-windows
          path: windows/win-assistants/dist
      - name: Real Windows frozen replacement and rollback acceptance
        shell: powershell
        run: |
          python windows/win-assistants/tests/frozen_update_restart_acceptance.py windows/win-assistants/dist/win-assistants.exe
          if ($LASTEXITCODE -ne 0) { throw "Frozen update/restart acceptance failed" }
      - name: Real Windows frozen number batch and Excel file lock acceptance
        shell: powershell
        run: |
          python windows/win-assistants/tests/frozen_number_batch_acceptance.py windows/win-assistants/dist/win-assistants.exe
          if ($LASTEXITCODE -ne 0) { throw "Frozen number batch acceptance failed" }


  native-navigation:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native Windows navigation and UI previews
        shell: powershell
        working-directory: windows/win-assistants
        run: |
          python -m unittest discover -s tests -p test_navigation.py -v
          if ($LASTEXITCODE -ne 0) { throw "Native navigation acceptance failed" }
          python -m unittest discover -s tests -p test_sedentary_unlock.py -v
          if ($LASTEXITCODE -ne 0) { throw "Native rest password acceptance failed" }
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw "Preview dependency failed" }
          python tests/render_navigation.py
          if ($LASTEXITCODE -ne 0) { throw "UI preview rendering failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: win-assistants-ui-preview
          retention-days: 1
          path: windows/win-assistants/dist/ui-preview
          if-no-files-found: error

  publish-release:
    needs: [source-validation, build-windows-exe, windows-update-validation, native-navigation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-assistants-windows
          path: windows/win-assistants/dist

      - name: Publish updater release branch
        id: publish_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(
            python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("win_assistants/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("version not found")
          print(match.group(1))
          PY
          )"
          sha="$(sha256sum dist/win-assistants.exe | awk '{print $1}')"
          size="$(stat -c '%s' dist/win-assistants.exe)"
          release_dir="$RUNNER_TEMP/win-assistants-release-assets"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          cp dist/win-assistants.exe "$release_dir/win-assistants.exe"

          python3 - "$release_dir/update.json" "$version" "$sha" "$size" <<'PY'
          import json
          import sys
          from pathlib import Path

          target, version, sha256, size = sys.argv[1:]
          payload = {
              "version": version,
              "exe_url": f"https://assistant.ziboxiaozhushou.cn/static/win-assistants/win-assistants.exe?version={version}&sha={sha256}",
              "sha256": sha256,
              "size": int(size),
              "notes": f"v{version}：修复久坐检测模型加载，兼容中文路径，并增加全部模型的打包启动校验。",
          }
          Path(target).write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "win-assistants-release:refs/remotes/origin/win-assistants-release" || true

          export GIT_INDEX_FILE="$RUNNER_TEMP/win-assistants-release.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          exe_blob="$(git hash-object -w "$release_dir/win-assistants.exe")"
          json_blob="$(git hash-object -w "$release_dir/update.json")"
          git update-index --add --cacheinfo "100644,$exe_blob,win-assistants.exe"
          git update-index --add --cacheinfo "100644,$json_blob,update.json"
          tree="$(git write-tree)"

          parent_args=()
          if git rev-parse --verify --quiet refs/remotes/origin/win-assistants-release >/dev/null; then
            parent="$(git rev-parse refs/remotes/origin/win-assistants-release)"
            parent_args=(-p "$parent")
          fi
          commit="$(printf 'release: win-assistants v%s\n' "$version" | git commit-tree "$tree" "${parent_args[@]}")"
          git push origin "$commit:refs/heads/win-assistants-release"

          echo "Published release branch win-assistants v$version ($sha)"

      - name: Report updater release status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          state="failure"
          description="win-assistants release asset publish failed"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            state="success"
            description="win-assistants release assets published"
          fi
          payload="$(python3 - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "win-assistants/release-assets",
              "description": sys.argv[2],
          }, separators=(",", ":")))
          PY
          )"
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "$payload"

