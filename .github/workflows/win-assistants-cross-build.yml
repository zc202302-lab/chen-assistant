name: win-assistants cross build

permissions:
  contents: write
  statuses: write

on:
  pull_request:
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  push:
    branches: [main]
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test
        run: |
          python -m compileall -q main.py win_assistants sedentary tests
          python -m unittest discover -s tests -v

  build-windows-exe:
    needs: source-validation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/win-assistants/requirements.txt
      - name: Install and test on Windows
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m compileall -q main.py win_assistants sedentary tests
          python -m unittest discover -s tests -v
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name win-assistants --collect-submodules pystray --collect-data cv2 `
            --hidden-import PIL.Image --hidden-import PIL.ImageDraw main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Verify packaged Python actually starts
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "win-assistants-smoke-ready.txt"
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath (Resolve-Path "dist/win-assistants.exe") -ArgumentList @("--smoke-test", $marker) -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged EXE did not finish smoke test; possible startup error dialog"
            }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $marker) -or
                (Get-Content -LiteralPath $marker -Raw) -ne "ready") {
              throw "Packaged EXE failed to load Python or bundled modules (exit=$($process.ExitCode))"
            }
          } finally {
            Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          }
      - name: Verify executable checksum
        shell: pwsh
        run: |
          $exe = "dist/win-assistants.exe"
          if ((Get-Item $exe).Length -le 0) { throw "Empty executable" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  win-assistants.exe" | Set-Content -Encoding ascii "dist/win-assistants.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: win-assistants-windows
          path: |
            windows/win-assistants/dist/win-assistants.exe
            windows/win-assistants/dist/win-assistants.exe.sha256
          if-no-files-found: error
      - name: Publish verified updater release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil
          version_text = Path("win_assistants/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__\s*=\s*"([^"]+)"', version_text).group(1)
          exe = Path("dist/win-assistants.exe")
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          out = Path("release-assets")
          out.mkdir(exist_ok=True)
          shutil.copy2(exe, out / "win-assistants.exe")
          (out / "update.json").write_text(json.dumps({
              "version": version,
              "exe_url": f"https://assistant.ziboxiaozhushou.cn/static/win-assistants/win-assistants.exe?version={version}&sha={digest}",
              "sha256": digest,
              "size": exe.stat().st_size,
              "notes": "v0.5.6：改用原生 Windows 构建，并验证打包后的 Python 能正常启动。"
          }, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "win-assistants-release:refs/remotes/origin/win-assistants-release" || true
          export GIT_INDEX_FILE="$RUNNER_TEMP/win-assistants-release.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          exe_blob="$(git hash-object -w windows/win-assistants/release-assets/win-assistants.exe)"
          json_blob="$(git hash-object -w windows/win-assistants/release-assets/update.json)"
          git update-index --add --cacheinfo "100644,$exe_blob,win-assistants.exe"
          git update-index --add --cacheinfo "100644,$json_blob,update.json"
          tree="$(git write-tree)"
          parent_args=()
          if git rev-parse --verify --quiet refs/remotes/origin/win-assistants-release >/dev/null; then
            parent_args=(-p "$(git rev-parse refs/remotes/origin/win-assistants-release)")
          fi
          commit="$(printf 'release: win-assistants v0.5.6\n' | git commit-tree "$tree" "${parent_args[@]}")"
          git push origin "$commit:refs/heads/win-assistants-release"
