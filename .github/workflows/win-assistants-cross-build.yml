name: win-assistants cross build

on:
  pull_request:
    paths:
      - "windows/win-assistants/**"
      - ".github/workflows/win-assistants-cross-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test
        run: |
          python -m compileall -q main.py win_assistants tests
          python -m unittest discover -s tests -v

  build-windows-exe:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    defaults:
      run:
        working-directory: windows/win-assistants
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable Wine
        run: |
          wine_root="${RUNNER_TEMP}/win-assistants-wine"
          mkdir -p "${wine_root}/debs" "${wine_root}/root"
          cd "${wine_root}/debs"
          apt-get download wine64 libwine
          for package in ./*.deb; do
            dpkg-deb --extract "${package}" "${wine_root}/root"
          done
          wine_bin="$(find "${wine_root}/root/usr/lib/wine" -type f -name wine64 -print -quit)"
          wineserver_bin="$(find "${wine_root}/root/usr/lib/wine" -type f -name wineserver64 -print -quit)"
          wine_dll_path="${wine_root}/root/usr/lib/x86_64-linux-gnu/wine"
          wine_prefix="${RUNNER_TEMP}/win-assistants-wine-prefix"
          test -x "${wine_bin}"
          test -x "${wineserver_bin}"
          test -d "${wine_dll_path}/x86_64-windows"
          ln -sfn "$(basename "${wineserver_bin}")" "$(dirname "${wine_bin}")/wineserver"
          mkdir -p "${wine_prefix}/drive_c/windows/system32"
          find "${wine_dll_path}/x86_64-windows" -maxdepth 1 -type f \
            -exec ln -sfn {} "${wine_prefix}/drive_c/windows/system32/" \;
          echo "WINE_BIN=${wine_bin}" >> "${GITHUB_ENV}"
          echo "WINESERVER=${wineserver_bin}" >> "${GITHUB_ENV}"
          echo "WINEDLLPATH=${wine_dll_path}" >> "${GITHUB_ENV}"
          echo "WINEARCH=win64" >> "${GITHUB_ENV}"
          echo "WINEDLLOVERRIDES=winemenubuilder.exe=d" >> "${GITHUB_ENV}"
          echo "WINEPREFIX=${wine_prefix}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${wine_root}/root/usr/lib/x86_64-linux-gnu:${wine_root}/root/lib/x86_64-linux-gnu" >> "${GITHUB_ENV}"
      - name: Prepare embedded Windows Python
        run: |
          windows_python="${RUNNER_TEMP}/win-assistants-python"
          mkdir -p "${windows_python}"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/python-3.12.10-embed-amd64.zip" \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          python3 -m zipfile -e "${RUNNER_TEMP}/python-3.12.10-embed-amd64.zip" "${windows_python}"
          sed -i 's/^#import site/import site/' "${windows_python}/python312._pth"
          curl --fail --location --retry 3 \
            --output "${windows_python}/get-pip.py" \
            "https://bootstrap.pypa.io/get-pip.py"
          echo "WINDOWS_PYTHON=${windows_python}/python.exe" >> "${GITHUB_ENV}"
          "$WINE_BIN" --version
          if ! "$WINE_BIN" "${windows_python}/python.exe" --version; then
            WINEDEBUG=+module "$WINE_BIN" "${windows_python}/python.exe" --version \
              > "${RUNNER_TEMP}/win-assistants-wine-module.log" 2>&1 || true
            tail -n 300 "${RUNNER_TEMP}/win-assistants-wine-module.log"
            exit 1
          fi
          "$WINE_BIN" "${windows_python}/python.exe" "${windows_python}/get-pip.py"
      - name: Install Windows build dependencies
        run: >-
          "$WINE_BIN" "$WINDOWS_PYTHON" -m pip install
          --disable-pip-version-check -r requirements.txt
      - name: Test with Windows Python
        run: |
          "$WINE_BIN" "$WINDOWS_PYTHON" -m compileall -q main.py win_assistants tests
          "$WINE_BIN" "$WINDOWS_PYTHON" -m unittest discover -s tests -v
      - name: Build Windows executable
        run: >-
          "$WINE_BIN" "$WINDOWS_PYTHON" -m PyInstaller --noconfirm --clean --onefile --windowed
          --name win-assistants --collect-submodules pystray
          --hidden-import PIL.Image --hidden-import PIL.ImageDraw main.py
      - name: Verify PE executable
        run: |
          test -s dist/win-assistants.exe
          file dist/win-assistants.exe | tee dist/file-type.txt
          grep -q "PE32" dist/file-type.txt
          sha256sum dist/win-assistants.exe | tee dist/win-assistants.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: win-assistants-windows
          path: |
            windows/win-assistants/dist/win-assistants.exe
            windows/win-assistants/dist/win-assistants.exe.sha256
          if-no-files-found: error
