name: assistant module isolation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  assistant-isolation:
    runs-on: [self-hosted, linux, x64, chen-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Verify removed library stays unavailable and data is preserved
        run: |
          python tests/cooking_removal_contract.py
      - name: Verify original business routing and architecture
        run: |
          python tests/routing_registry_contract.py
          python tests/architecture_governance_contract.py
