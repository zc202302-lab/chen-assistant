{% extends 'base.html' %}
{% block title %}提醒中心 · 晨的助手{% endblock %}
{% block content %}
<div id="reminder-center" data-csrf="{{ csrf }}">
  <div class="reminder-heading"><div><h1>提醒中心</h1></div><span id="reminder-count" class="reminder-pill">加载中</span></div>
  <nav class="reminder-tabs" aria-label="提醒中心栏目">
    <button type="button" class="reminder-tab active" data-reminder-tab="inbox" aria-pressed="true">待处理提醒</button>
    <button type="button" class="reminder-tab" data-reminder-tab="settings" aria-pressed="false">提醒设置</button>
  </nav>
  <div data-reminder-panel="inbox">
    <section class="reminder-card"><h2>待处理提醒</h2><div id="reminder-items"></div></section>
  </div>
  <div data-reminder-panel="settings" hidden>
    <section class="reminder-card">
      <div class="reminder-section-heading"><h2>手机提醒</h2><button type="button" id="push-enable" class="reminder-switch" role="switch" aria-label="本机通知" aria-checked="false" disabled></button></div>
      <p id="push-status" class="reminder-status" role="status">检查中</p>
      <div class="reminder-actions"><button type="button" id="push-test" disabled>测试提醒</button><button type="button" id="push-test-lock" disabled>锁屏测试 · 20秒</button></div>
      <p id="push-delivery" class="reminder-status" role="status" aria-live="polite"></p>
      <p id="reminder-feedback" class="reminder-status" role="status" aria-live="polite"></p>
    </section>
    <section class="reminder-card">
      <div class="reminder-section-heading"><h2>定时提醒</h2><span class="reminder-caption">北京时间</span></div>
      <div id="reminder-schedule-list" class="reminder-schedule-list"></div>
      <div class="reminder-schedule-add"><input type="time" id="reminder-schedule-time" value="09:00" aria-label="新增提醒时间"><button type="button" id="reminder-schedule-add">添加</button></div>
      <p id="reminder-schedule-feedback" class="reminder-status" role="status" aria-live="polite"></p>
    </section>
    <section class="reminder-card"><h2>通知类别</h2><div id="reminder-preferences" class="reminder-preferences"></div></section>
    <section class="reminder-card"><h2>已连接设备</h2><div id="reminder-devices"></div></section>
  </div>
</div>
{% endblock %}
