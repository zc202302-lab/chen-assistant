{% extends 'base.html' %}
{% block title %}提醒中心 · 晨的助手{% endblock %}
{% block content %}
<div id="reminder-center" data-csrf="{{ csrf }}">
  <div class="reminder-heading"><div><h1>提醒中心</h1></div><span id="reminder-count" class="reminder-pill">加载中</span></div>
  <nav class="reminder-tabs" aria-label="提醒中心栏目">
    <button type="button" class="reminder-tab active" data-reminder-tab="inbox" aria-pressed="true">待处理提醒</button>
    <button type="button" class="reminder-tab" data-reminder-tab="settings" aria-pressed="false">提醒设置</button>
  </nav>
  <div data-reminder-panel="inbox">
    <section class="reminder-card"><h2>待处理提醒</h2><div id="reminder-items"></div></section>
  </div>
  <div data-reminder-panel="settings" hidden>
    <section class="reminder-card"><h2>手机提醒</h2>
      <p id="push-status" role="status">正在检查设备…</p>
      <div class="reminder-actions"><button type="button" id="push-enable" disabled>开启手机提醒</button><button type="button" id="push-test" disabled>发送测试提醒</button><button type="button" id="push-test-lock" disabled>20 秒后锁屏测试</button><button type="button" id="push-disable" disabled>关闭本机提醒</button></div>
      <p id="push-delivery" role="status" aria-live="polite">正在读取后台发送结果…</p>
      <p class="reminder-help">iPhone：在 Safari 中打开主站，选择“分享 → 添加到主屏幕”，再从主屏幕打开并开启提醒。</p>
      <p id="reminder-feedback" role="status" aria-live="polite"></p>
    </section>
    <section class="reminder-card"><h2>通知类别</h2><div id="reminder-preferences" class="reminder-preferences"></div></section>
    <section class="reminder-card"><h2>手机与浏览器设备</h2><div id="reminder-devices"></div></section>
  </div>
</div>
{% endblock %}
