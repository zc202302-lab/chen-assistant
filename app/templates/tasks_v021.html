{% extends "base.html" %}{% block title %}待办 · {{ customer.name }}{% endblock %}{% block content %}
<section class="subpage-head"><a class="back-link" href="/customers/{{ customer.id }}">← {{ customer.name }}</a><div class="subpage-title"><div><p class="eyebrow">二级页面</p><h1>待办</h1></div></div></section>
<section class="card compact-card">{% for t in tasks %}<div class="info-row {% if t.done %}done{% endif %}"><div><b>{{ t.title }}</b><small>{{ t.remind_date or '无日期' }}{% if t.note %} · {{ t.note }}{% endif %}</small></div><form method="post" action="/tasks/{{ t.id }}/toggle"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost small">{% if t.done %}恢复{% else %}完成{% endif %}</button></form></div>{% else %}<p class="empty">没有待办。</p>{% endfor %}</section>
<section class="card"><h2>新增待办</h2><form method="post" action="/customers/{{ customer.id }}/tasks" class="stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label>事项<input name="title" required></label><label>提醒日期<input type="date" name="remind_date"></label><label>备注<textarea name="note" rows="3"></textarea></label><button class="primary">保存待办</button></form></section>
{% endblock %}
