{% extends "base.html" %}
{% block title %}新建菜谱 · 晨的助手{% endblock %}
{% block content %}<section class="v10-shell v10-narrow"><a class="v10-back" href="/life/recipes">← 返回菜谱</a><div class="v10-page-head"><div><span class="v10-kicker">新建</span><h1>新建菜谱</h1><p>先建立菜谱和初始标准，随后进入完整配方编辑。</p></div></div><form class="v10-form-card" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>菜名<input name="name" required></label><div class="v10-form-grid"><label>分类<input name="category" placeholder="肉类 / 素菜 / 汤…"></label><label>标签<input name="tags" placeholder="糖醋,排骨,家常"></label><label>标准主材重量<input name="base_amount" type="number" step="0.01" value="500" required></label><label>单位<input name="base_unit" value="g"></label></div><label>说明<textarea name="description" rows="3"></textarea></label><button class="v10-primary" type="submit">创建并编辑配方</button></form></section>{% endblock %}
