{% extends "base.html" %}
{% block title %}新建菜谱 · 晨的助手{% endblock %}
{% block content %}
<section class="v10-shell v10-narrow" data-recipe-create>
  <a class="v10-back" href="/life/recipes">← 返回菜谱库</a>
  <div class="v10-page-head"><div><span class="v10-kicker">新建菜谱 · 第 1 步 / 共 2 步</span><h1>新建菜谱</h1><p>先填写基本信息，下一步添加配料和制作步骤。</p></div></div>
  <form class="v10-form-card" method="post" action="/life/recipes/new">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>菜名<input name="name" placeholder="例如：鱼锅泡饼" required></label>
    <div class="v10-form-grid">
      <label>分类<input name="category" placeholder="肉类 / 素菜 / 汤…"></label>
      <label>标签<input name="tags" placeholder="家常,鱼类"></label>
      <label>标准主材重量<input name="base_amount" type="number" min="0.01" step="0.01" value="500" required></label>
      <label>单位<input name="base_unit" value="g"></label>
    </div>
    <label>说明<textarea name="description" rows="3" placeholder="记录口味、适用场景或准备事项"></textarea></label>
    <button class="v10-primary" type="submit">创建并编辑配方</button>
    <a class="v10-back" href="/life/recipes">取消</a>
  </form>
</section>
{% endblock %}
