{% extends "base.html" %}{% block title %}{{ '编辑' if item else '新建' }}知识 · 晨的助手{% endblock %}{% block content %}<section class="v10-shell v10-narrow"><a class="v10-back" href="/life/knowledge">← 烹饪知识</a><div class="v10-page-head"><div><span class="v10-kicker">知识库</span><h1>{{ '编辑知识点' if item else '新建知识点' }}</h1></div></div><form class="v10-form-card" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>分类<input name="category" value="{{ item.category if item else '' }}" placeholder="调味 / 火力 / 勾芡…"></label><label>标题<input name="title" value="{{ item.title if item else '' }}" required></label><label>内容<textarea name="content" rows="8" required>{{ item.content if item else '' }}</textarea></label><button class="v10-primary">保存</button></form></section>{% endblock %}
