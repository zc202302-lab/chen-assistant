<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>请填写加集团号码</title>
  <link rel="stylesheet" href="/static/number-inbox-v162.css?v=1620">
</head>
<body class="number-submit-page">
  <main class="number-submit-shell">
    <section class="number-submit-card">
      <div class="number-submit-head">
        <h1>请填写加集团号码</h1>
      </div>

      <form method="post" action="/number-submit/{{ token }}" class="number-submit-form">
        <label>
          <span>号码 <b>必填</b></span>
          <input name="number" inputmode="tel" autocomplete="tel" required maxlength="64" placeholder="例如：13800138000">
        </label>
        <label>
          <span>提交人</span>
          <input name="submitter" autocomplete="name" maxlength="40" placeholder="你的姓名">
        </label>
        <button type="submit">提交号码</button>
      </form>
      <a class="number-public-link" href="/number-submit/{{ token }}/pending">查看待录入号码</a>
    </section>
  </main>
</body>
</html>
