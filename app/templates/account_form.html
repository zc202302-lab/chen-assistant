{% extends "base.html" %}{% block title %}新建网址账户{% endblock %}{% block content %}<section class="page-head"><h1>新建网址账户</h1></section><section class="card"><form method="post" action="/accounts/new" class="stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label>平台名称 *<input name="platform" required placeholder="GitHub"></label><label>登录网址<input type="url" name="url" placeholder="https://github.com"></label><label>用户名<input name="username"></label><label>注册邮箱<input type="email" name="email"></label><label>手机号<input name="phone" inputmode="tel"></label><label>密码<input type="password" name="password" autocomplete="new-password"></label><label>标签<input name="tags" placeholder="开发,个人,重要"></label><label>备注<textarea name="notes" rows="4"></textarea></label><button class="primary">保存账户</button></form></section>{% endblock %}
